<div class="row animated fadeIn fast">
  <div class="col-12">
    <div class="card">
      <div class="card-body">
        <input
          type="text"
          class="form-control"
          placeholder="Buscar medico..."
          (keyup)="buscar(txtBuscar.value)"
          #txtBuscar
        />
      </div>
    </div>
  </div>
</div>

<div class="row animated fadeIn fast" *ngIf="cargando">
  <div class="col-12">
    <div class="alert alert-info text-center" role="alert">
      <h4 class="alert-heading">Cargando...</h4>
      <i class="fa fa-spin fa-refresh fa-2x"></i>
      <p class="mb-0">Por favor espere</p>
    </div>
  </div>
</div>

<div class="row animated fadeIn fast" *ngIf="!cargando">
  <div class="col-12">
    <div class="card">
      <div class="card-body">
        <div class="row">
          <div class="col-8">
            <h4 class="card-title">Medicos ({{ medicos.length }})</h4>
            <h6 class="card-subtitle">Medicos registrados en el sistema</h6>
          </div>

          <div class="col">
            <div class="text-right">
              <button class="btn btn-primary" (click)="crearMedico()">
                <i class="fa fa-hospital-o"></i>
                Crear medico
              </button>
            </div>
          </div>
        </div>

        <div class="table-responsive">
          <table class="table table-bordered">
            <thead>
              <tr>
                <th class="w100">Foto</th>
                <th>Nombre</th>
                <th class=" w100 text-nowrap">Acciones</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let medico of medicos">
                <td><img [src]="medico.img ?? 'no-image' | imagen: 'medicos'" class="avatar cursor"  alt="medicos" (click)="abrirModal(medico)"/></td>
                 <td>
                 {{ medico.nombre }}
                </td>
                
                <td class="text-nowrap text-center">
                  <a data-toggle="tooltip" data-original-title="Editar" class="cursor" [routerLink]="['/dashboard', 'medico', medico._id]">
                    <i class="fa fa-pencil text-inverse m-r-10"></i>
                  </a>
                  <a  data-toggle="tooltip" data-original-title="Eliminar" class="cursor" (click)="eliminarMedicos(medico)">
                    <i class="fa fa-close text-danger"></i>
                  </a>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
